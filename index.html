<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Blue Mountain Racing concept map</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="Locations">
      <div class="sidebar__handle">
        <button
          class="sidebar__grabber"
          type="button"
          aria-expanded="false"
          aria-label="Show locations"
        ></button>
        <div class="sidebar__bar">
          <h1 class="sidebar__title">Blue Mountain Racing</h1>
          <button class="sidebar__reset" type="button">Reset view</button>
        </div>
      </div>
      <div class="sidebar__body">
        <div class="sidebar__search-row">
          <input
            class="sidebar__search"
            type="search"
            placeholder="Search locations"
            aria-label="Search locations"
            autocomplete="off"
          />
        </div>
        <p class="sidebar__empty" role="status"></p>
        <div class="sidebar__list"></div>
      </div>
    </aside>
    <main id="app"></main>
    <aside id="info-panel" class="info-panel" aria-label="Location details" aria-live="polite" hidden>
      <div class="info-panel__bar">
        <p class="info-panel__precinct"></p>
        <button class="info-panel__close" type="button" aria-label="Close details">&times;</button>
      </div>
      <div class="info-panel__body">
        <!-- biome-ignore lint/a11y/useHeadingContent: filled in when a location is picked -->
        <h2 class="info-panel__name"></h2>
        <p class="info-panel__description"></p>
      </div>
    </aside>
    <section id="event-switch" class="event-switch" aria-label="Show the site in use">
      <div class="event-switch__buttons"></div>
      <p class="event-switch__summary" role="status" hidden></p>
    </section>
    <p class="notice">Concept layout, for illustration only</p>
    <div id="loading" class="loading" role="status">Loading the map&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
