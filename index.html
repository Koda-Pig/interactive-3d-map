<!doctype html>
<html lang="en" class="sidebar-closed intro">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Blue Mountain Racing concept map</title>
    <link rel="icon" href="data:," />
    <!-- The title screen shows while the scripts and models load, so its styles can't wait for them. -->
    <style>
      @font-face {
        font-family: "Roboto";
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url("/node_modules/@fontsource/roboto/files/roboto-latin-500-normal.woff2")
          format("woff2");
      }
      .title {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        background: radial-gradient(120% 90% at 50% 38%, #00527f 0%, #003257 46%, #001a30 100%);
        color: #fff;
        font:
          500 14px / 1.3 Roboto,
          system-ui,
          sans-serif;
        text-align: center;
        transition: opacity 1100ms ease;
      }
      .title--leaving {
        opacity: 0;
        pointer-events: none;
      }
      .title__circuit {
        width: min(46vw, 42vh, 300px);
        margin-bottom: 14px;
        overflow: visible;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .title__track {
        stroke: rgb(255 255 255 / 92%);
        stroke-width: 2.5;
        stroke-dasharray: 1;
        filter: drop-shadow(0 0 7px rgb(28 167 236 / 75%));
        animation: title-draw 2200ms cubic-bezier(0.65, 0, 0.2, 1) both;
      }
      /* A light that laps the circuit for as long as the map is loading. */
      .title__car {
        stroke: #ffb81c;
        stroke-width: 4;
        stroke-dasharray: 0.035 0.965;
        filter: drop-shadow(0 0 5px #ffb81c);
        opacity: 0;
        animation:
          title-appear 500ms ease 2000ms forwards,
          title-lap 3600ms linear 2000ms infinite;
      }
      .title__name {
        margin: 0;
        font-size: clamp(18px, 3.4vw, 30px);
        font-weight: 500;
        letter-spacing: 0.3em;
        /* Letter spacing follows the last letter too, which would push the name off centre. */
        margin-right: -0.3em;
        text-transform: uppercase;
        animation: title-rise 900ms ease 350ms both;
      }
      .title__place {
        margin: 0;
        color: rgb(255 255 255 / 72%);
        font-size: 13px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        animation: title-rise 900ms ease 650ms both;
      }
      .title__status {
        position: absolute;
        bottom: max(28px, env(safe-area-inset-bottom));
        left: 24px;
        right: 24px;
        margin: 0;
        color: rgb(255 255 255 / 60%);
        font-size: 12px;
        animation: title-appear 600ms ease 1200ms both;
      }
      @keyframes title-draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes title-lap {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes title-appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes title-rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .title,
        .title .title__track,
        .title .title__name,
        .title .title__place,
        .title .title__status {
          animation: none;
          transition: none;
        }
        .title__car {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="Locations">
      <!-- On a wide screen the shell is the one shape that is either the panel or the button. -->
      <div class="sidebar__shell">
        <div id="sidebar-pane" class="sidebar__inner">
          <div class="sidebar__handle">
            <button
              class="sidebar__grabber"
              type="button"
              aria-expanded="false"
              aria-label="Show locations"
            ></button>
            <div class="sidebar__bar">
              <h1 class="sidebar__title">Blue Mountain Racing</h1>
              <button class="sidebar__reset" type="button">Reset view</button>
              <button
                class="sidebar__close"
                type="button"
                aria-label="Hide locations"
              >
                &times;
              </button>
            </div>
          </div>
          <div class="sidebar__body">
            <div class="sidebar__search-row">
              <input
                class="sidebar__search"
                type="search"
                placeholder="Search locations"
                aria-label="Search locations"
                autocomplete="off"
              />
            </div>
            <p class="sidebar__empty" role="status"></p>
            <div class="sidebar__list"></div>
          </div>
        </div>
      </div>
      <!-- The shell's collapsed state. It has no background of its own. -->
      <button
        id="sidebar-open"
        class="sidebar-open"
        type="button"
        aria-controls="sidebar-pane"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        Locations
      </button>
    </aside>
    <main id="app"></main>
    <!-- Before the details panel, so the panel covers it where they meet on a phone. -->
    <p id="hint" class="hint"></p>
    <aside
      id="info-panel"
      class="info-panel"
      aria-label="Location details"
      aria-live="polite"
      hidden
    >
      <div class="info-panel__bar">
        <p class="info-panel__precinct"></p>
        <button
          class="info-panel__close"
          type="button"
          aria-label="Close details"
        >
          &times;
        </button>
      </div>
      <img class="info-panel__image" alt="" hidden />
      <div class="info-panel__body">
        <!-- biome-ignore lint/a11y/useHeadingContent: filled in when a location is picked -->
        <h2 class="info-panel__name"></h2>
        <p class="info-panel__description"></p>
        <div class="info-panel__actions" hidden>
          <div class="info-panel__action-groups"></div>
          <p class="info-panel__actions-note">Placeholder links in this concept</p>
        </div>
        <nav class="info-panel__related" aria-label="Nearby" hidden>
          <ul class="info-panel__related-list"></ul>
        </nav>
      </div>
    </aside>
    <section
      id="event-switch"
      class="event-switch"
      aria-label="Show the site in use"
    >
      <div class="event-switch__buttons"></div>
      <label class="event-switch__mobile">
        <select aria-label="Site view" class="event-switch__select"></select>
      </label>
      <button class="event-switch__info" type="button" aria-label="About this event" aria-expanded="false" aria-controls="event-summary" hidden>i</button>
      <p id="event-summary" class="event-switch__summary" hidden></p>
    </section>
    <section class="tour-player" aria-label="Guided tours">
      <fieldset class="tours" aria-label="Tours">
        <div class="tours__choices">
          <span class="tours__heading">Explore the venue</span>
          <div class="tours__actions">
            <button class="tours__button" type="button" data-tour="lap">Lap the circuit</button>
            <button class="tours__button" type="button" data-tour="arrival">Arrive for a race</button>
          </div>
        </div>
        <div class="tours__playing" hidden>
          <div class="tours__description">
            <strong class="tours__name"></strong>
            <span class="tours__status">Getting into position…</span>
          </div>
          <p class="tours__telemetry" hidden>
            <span class="tours__speedometer"><span class="tours__kmh">0</span> km/h</span>
            <span class="tours__place"></span>
          </p>
          <div class="tours__speed">
            <label for="tour-speed">Speed</label>
            <select id="tour-speed" data-tour-speed>
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
              <option value="3">3×</option>
              <option value="4">4×</option>
            </select>
          </div>
          <button class="tours__stop" type="button">Stop</button>
          <progress class="tours__progress" max="1" value="0" aria-label="Tour progress"></progress>
        </div>
      </fieldset>
      <p class="route-legend" hidden>
        <span class="route-legend__item route-legend__item--drive">By road</span>
        <span class="route-legend__item route-legend__item--walk">On foot</span>
      </p>
    </section>
    <p class="notice">Concept layout, for illustration only</p>
    <section
      id="map-controls"
      class="map-controls"
      aria-label="Map view"
    ></section>
    <div id="loading" class="title">
      <!-- circuit-outline -->
      <p class="title__name">Blue Mountain Racing</p>
      <p class="title__place">Swartland &middot; Western Cape</p>
      <p class="title__status" role="status">Loading the concept map&hellip;</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
